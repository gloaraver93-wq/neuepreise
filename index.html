<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tuningrechner</title>
<style>
:root{--bg:#f3f3f5;--card:#fff;--tx:#17171a;--mu:#6b6b75;--bd:#dcdce2;--ac:#e8523a;--ok:#1e9e5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#121214;--card:#1c1c20;--tx:#f1f1f3;--mu:#9a9aa5;--bd:#2c2c33;--ok:#2fbf71;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit;color:var(--tx)}
input{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
h1{margin:0;font:800 24px/1 Impact,"Arial Narrow",sans-serif;letter-spacing:.04em;text-transform:uppercase}h1 span{color:var(--ac)}
h2{margin:0;font-size:16px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--card)}
.btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);cursor:pointer;font-weight:600}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.q{width:28px;height:28px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);cursor:pointer;line-height:1;flex:none}
.main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
label{display:block;font-size:12px;color:var(--mu);margin-top:8px}label input{margin-top:3px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px;max-height:380px;overflow:auto}
.pc{position:relative;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer;font-weight:600;font-size:13px;min-height:54px;display:flex;align-items:center;justify-content:center}
.pc:hover{border-color:var(--ac)}.pc:active{transform:scale(.97)}.pc.sel{border-color:var(--ac)}
.bd{position:absolute;top:5px;right:5px;background:var(--ac);color:#fff;border-radius:12px;min-width:22px;padding:1px 6px;font-size:12px;font-weight:700}
.lr{display:grid;grid-template-columns:minmax(0,1fr) auto 28px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--bd)}
.qt{display:flex;gap:3px;align-items:center}.qt input{width:56px;text-align:center}
.empty{color:var(--mu);padding:8px 0}.hint{font-size:12px;color:var(--mu);margin-top:6px}.big{font-weight:700}.mu{color:var(--mu)}.sm{font-size:12px}
.rbox{text-align:center;position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:10;box-shadow:0 2px 16px #0004;border-color:var(--ac)}
.rt2{font:800 38px/1.1 Impact,"Arial Narrow",sans-serif;color:var(--ac);margin:2px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;width:100%;max-width:560px;max-height:100%;overflow:auto}
.pm{display:grid;grid-template-columns:minmax(0,1fr) 100px 28px;gap:6px;align-items:center;margin-top:8px}
.sv{font-size:13px;color:var(--mu)}.sv.ok{color:var(--ok)}.sv.err{color:#d33;font-weight:600}
</style></head><body>
<header class="top"><h1>Tuning<span>rechner</span></h1>
<div class="btns"><span id="sv" class="sv"></span><button class="btn" id="bClear" type="button">🗑️ Leeren</button><button class="btn" id="bCopy" type="button">📋 Text kopieren</button></div></header>
<div class="main">
 <div class="card"><div class="line"><h2>Leistungen</h2><button class="btn" id="bParts" type="button">✏️ Leistungen verwalten</button></div>
  <input id="ps" type="search" placeholder="Leistung suchen …" aria-label="Leistung suchen"><div class="pgrid" id="pg"></div></div>
 <div class="card"><h2 style="margin-bottom:6px">Auswahl</h2><div id="ll"></div></div>
 <div class="card"><label style="margin-top:0">Rabatt %<input id="iDc" type="number" min="0" max="100" step="any"></label></div>
 <div class="card rbox"><div class="mu sm">Kundenpreis</div><div class="rt2" id="rTot">$0</div><div class="hint" id="rNote"></div></div>
</div>
<div class="modal" id="mP"><div class="mc"><div class="line"><h2>✏️ Leistungen verwalten</h2><button class="q" data-close type="button">✕</button></div>
 <div class="hint">Name und Preis ändern, Leistungen hinzufügen oder löschen. Änderungen wirken sofort auf die Berechnung.</div><div id="pl"></div>
 <div class="btns" style="margin-top:10px"><button class="btn p" id="pAdd" type="button">➕ Neue Leistung</button><button class="btn" id="pRes" type="button">↺ Standardliste</button></div></div></div>
<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var esc=function(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var r2=function(x){return Math.round((Number(x)||0)*100)/100};
function num(v,min,max){var n=parseFloat(String(v).replace(",","."));if(!isFinite(n))n=0;if(min!=null)n=Math.max(min,n);if(max!=null)n=Math.min(max,n);return n}
function fmt(n){n=r2(n);var a=Math.abs(n);return (n<0?"−":"")+"$"+a.toLocaleString("de-DE",{minimumFractionDigits:Number.isInteger(a)?0:2,maximumFractionDigits:2})}
var KEY="tr_rechnung_v1",PV=5;
var OLDSIGS=["Fahrwerksteile|500;Motoröl|500;Motorswap|30000;Ersatzreifen|500;Luftfilter|500;Elektromotor|1500;Ersatzkupplung|500;Elektrofahrzeug-Batterie|500;Zündkerze|500;Ersatzbremsbeläge|500;Elektrofahrzeug-Kühlmittel|500;Keramikbremsen|10000;Optische Anbauteile|1000;Lackierset|250;Fahrzeugrädersatz|1000;Reifenrauch-Set|1000;Fahrzeugextras-Set|1000;Reinigungsset|250;Reparaturset|2500;Gewebeklebeband|2500;Leistungsteile|2500", "Motorstufe 1|8000;Motorstufe 2|14000;Motorstufe 3|22000;Motorstufe 4|32000;Turbo|18000;Getriebe Stufe 1|6000;Getriebe Stufe 2|10000;Getriebe Stufe 3|15000;Bremsen Stufe 1|4000;Bremsen Stufe 2|7000;Bremsen Stufe 3|11000;Fahrwerk Stufe 1|4000;Fahrwerk Stufe 2|7000;Fahrwerk Stufe 3|11000;Tieferlegung|3500;Spoiler|2000;Frontstoßstange|2500;Heckstoßstange|2500;Seitenschweller|2000;Motorhaube|2000;Auspuffanlage|3500;Lackierung|5000;Felgen|4000", "Motorstufe 1|8000;Motorstufe 2|14000;Motorstufe 3|22000;Motorstufe 4|32000;Turbo|18000;Getriebe Stufe 1|6000;Getriebe Stufe 2|10000;Getriebe Stufe 3|15000;Bremsen Stufe 1|4000;Bremsen Stufe 2|7000;Bremsen Stufe 3|11000;Fahrwerk Stufe 1|4000;Fahrwerk Stufe 2|7000;Fahrwerk Stufe 3|11000;Tieferlegung|3500;Optisches Tuningteil|2000;Lackierung|2000;Felgen|4000", "Motorstufe 1|8000;Motorstufe 2|14000;Motorstufe 3|22000;Motorstufe 4|32000;Turbo|18000;Getriebe Stufe 1|6000;Getriebe Stufe 2|10000;Getriebe Stufe 3|15000;Bremsen Stufe 1|4000;Bremsen Stufe 2|7000;Bremsen Stufe 3|11000;Fahrwerk Stufe 1|4000;Fahrwerk Stufe 2|7000;Fahrwerk Stufe 3|11000;Optisches Tuningteil|2000;Lackierung|2000;Felgen|4000"];
var PARTS0=[["Motorstufe 1", 8000], ["Motorstufe 2", 14000], ["Motorstufe 3", 22000], ["Motorstufe 4", 32000], ["Turbolader", 18000], ["Getriebe Stufe 1", 6000], ["Getriebe Stufe 2", 10000], ["Getriebe Stufe 3", 15000], ["Bremsen Stufe 1", 4000], ["Bremsen Stufe 2", 7000], ["Bremsen Stufe 3", 11000], ["Fahrwerk Stufe 1", 4000], ["Fahrwerk Stufe 2", 7000], ["Fahrwerk Stufe 3", 11000], ["Optisches Tuningteil", 2500], ["Lackierset", 2000], ["Fahrzeugrädersatz", 4000], ["Reifenrauch-Set", 2000], ["Fahrzeugextras-Set", 2000], ["Fahrwerksteile", 1000], ["Motoröl", 1000], ["Motorswap", 60000], ["Ersatzreifen", 1000], ["Luftfilter", 1000], ["Elektromotor", 3000], ["Ersatzkupplung", 1000], ["Elektrofahrzeug-Batterie", 1000], ["Zündkerze", 1000], ["Ersatzbremsbeläge", 1000], ["Elektrofahrzeug-Kühlmittel", 1000], ["Keramikbremsen", 20000], ["Reinigungsset", 500], ["Reparaturset", 5000], ["Gewebeklebeband", 5000]];
function defParts(){return PARTS0.map(function(p,i){return {id:"p"+i,name:p[0],price:p[1]}})}
var S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||typeof S!=="object"||!Array.isArray(S.parts))S={pv:PV,parts:defParts(),cur:{dc:0,lines:[]}};
function sig(a){return a.map(function(p){return p.name+"|"+p.price}).join(";")}
if(!S.cur||typeof S.cur!=="object")S.cur={dc:0,lines:[]};if(!Array.isArray(S.cur.lines))S.cur.lines=[];S.cur.dc=num(S.cur.dc,0,100);
if(S.pv!==PV){if(OLDSIGS.indexOf(sig(S.parts))>=0)S.parts=defParts();S.pv=PV}
var lock=0;
function sv(t,c,hold){if(!hold&&Date.now()<lock)return;if(hold)lock=Date.now()+2500;var e=$("sv");e.textContent=t;e.className="sv "+(c||"")}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));sv("✔ Gespeichert "+new Date().toLocaleTimeString("de-DE"),"ok")}catch(e){sv("⚠️ Speichern fehlgeschlagen (Speicher voll oder blockiert)","err")}}
function priceOf(l){var p=S.parts.find(function(x){return x.id===l.pid})||S.parts.find(function(x){return x.name===l.n});return p?num(p.price,0):num(l.p,0)}
function total(){var sub=0;S.cur.lines.forEach(function(l){sub+=num(l.q,0)*priceOf(l)});return r2(r2(sub)*(1-num(S.cur.dc,0,100)/100))}
function updR(){$("rTot").textContent=fmt(total());$("rNote").textContent=num(S.cur.dc,0)>0?"inkl. "+num(S.cur.dc,0,100)+" % Rabatt":""}
function renderParts(){var q=$("ps").value.toLowerCase(),g=$("pg");g.innerHTML="";
S.parts.forEach(function(p){if(q&&p.name.toLowerCase().indexOf(q)<0)return;var c=0;S.cur.lines.forEach(function(l){if(l.pid===p.id)c+=num(l.q,0)});
var b=document.createElement("button");b.type="button";b.className="pc"+(c?" sel":"");b.dataset.id=p.id;b.innerHTML=esc(p.name)+(c?'<span class="bd">'+c+'×</span>':"");g.appendChild(b)});
if(!g.children.length)g.innerHTML='<div class="empty">Keine Leistung gefunden.</div>'}
$("ps").oninput=renderParts;
$("pg").onclick=function(e){var b=e.target.closest(".pc");if(!b)return;var p=S.parts.find(function(x){return x.id===b.dataset.id});if(!p)return;
var l=S.cur.lines.find(function(x){return x.pid===p.id});if(l)l.q=num(l.q,0)+1;else S.cur.lines.push({pid:p.id,n:p.name,q:1,p:p.price});all()};
function renderLines(){var L=$("ll");L.innerHTML="";if(!S.cur.lines.length){L.innerHTML='<div class="empty">Noch nichts ausgewählt. Leistungen oben antippen.</div>';return}
S.cur.lines.forEach(function(l,i){var r=document.createElement("div");r.className="lr";
r.innerHTML='<div class="big">'+esc(l.n)+'</div><div class="qt"><button type="button" class="q" data-a="m" data-i="'+i+'">−</button><input type="number" min="0" step="any" data-i="'+i+'" value="'+esc(l.q)+'" aria-label="Menge"><button type="button" class="q" data-a="p" data-i="'+i+'">+</button></div><button type="button" class="q" data-a="d" data-i="'+i+'" title="Entfernen">✕</button>';L.appendChild(r)})}
$("ll").addEventListener("input",function(e){var t=e.target;if(t.dataset.a||t.dataset.i==null)return;var l=S.cur.lines[+t.dataset.i];if(!l)return;l.q=num(t.value,0);updR();renderParts();persist()});
$("ll").addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;var i=+b.dataset.i,l=S.cur.lines[i],a=b.dataset.a;if(!l)return;
if(a==="m")l.q=Math.max(0,num(l.q,0)-1);if(a==="p")l.q=num(l.q,0)+1;if(a==="d")S.cur.lines.splice(i,1);all()});
$("iDc").addEventListener("input",function(){S.cur.dc=num($("iDc").value,0,100);updR();persist()});
$("bClear").onclick=function(){var b=this;if(!S.cur.lines.length)return;if(b.dataset.arm!=="1"){b.dataset.arm="1";b.textContent="Sicher?";setTimeout(function(){b.dataset.arm="";b.textContent="🗑️ Leeren"},3000);return}b.dataset.arm="";b.textContent="🗑️ Leeren";S.cur.lines=[];all()};
function copyText(x,ok){var f=function(){var a=document.createElement("textarea");a.value=x;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){sv("Kopieren nicht möglich.","err",true)}a.remove()};try{navigator.clipboard.writeText(x).then(ok,f)}catch(e){f()}}
$("bCopy").onclick=function(){var x="Tuningrechner\n\n";S.cur.lines.forEach(function(l){x+=num(l.q,0)+"× "+l.n+"\n"});x+="\nKundenpreis: "+fmt(total());copyText(x,function(){sv("📋 Kopiert.","ok",true)})};
function renderPM(){var L=$("pl");L.innerHTML="";S.parts.forEach(function(p,i){var r=document.createElement("div");r.className="pm";
r.innerHTML='<input data-i="'+i+'" data-f="name" value="'+esc(p.name)+'" aria-label="Name"><input type="number" min="0" step="any" data-i="'+i+'" data-f="price" value="'+esc(p.price)+'" aria-label="Preis"><button class="q" data-d="'+i+'" type="button" title="Löschen">✕</button>';L.appendChild(r)})}
$("pl").addEventListener("input",function(e){var t=e.target,f=t.dataset.f;if(!f)return;var p=S.parts[+t.dataset.i];if(!p)return;if(f==="price")p.price=num(t.value,0);else{p.name=t.value;S.cur.lines.forEach(function(l){if(l.pid===p.id)l.n=p.name})}renderLines();renderParts();updR();persist()});
$("pl").addEventListener("click",function(e){var d=e.target.closest("[data-d]");if(!d)return;if(d.dataset.arm!=="1"){d.dataset.arm="1";d.textContent="?";return}var p=S.parts.splice(+d.dataset.d,1)[0];S.cur.lines=S.cur.lines.filter(function(l){return l.pid!==p.id});renderPM();all()});
$("pAdd").onclick=function(){S.parts.push({id:"p"+Date.now(),name:"Neue Leistung",price:0});renderPM();renderParts();persist();var n=$("pl").querySelectorAll('[data-f="name"]');n[n.length-1].focus();n[n.length-1].select()};
$("pRes").onclick=function(){var b=this;if(b.dataset.arm!=="1"){b.dataset.arm="1";b.textContent="Sicher? Nochmal klicken";setTimeout(function(){b.dataset.arm="";b.textContent="↺ Standardliste"},3000);return}
b.dataset.arm="";b.textContent="↺ Standardliste";S.parts=defParts();S.cur.lines=S.cur.lines.filter(function(l){return S.parts.some(function(p){return p.id===l.pid})});renderPM();all()};
$("bParts").onclick=function(){renderPM();$("mP").style.display="flex"};
function all(){renderLines();renderParts();updR();persist()}
document.querySelectorAll(".modal").forEach(function(m){m.addEventListener("click",function(e){if(e.target===m||e.target.hasAttribute("data-close"))m.style.display="none"})});
$("iDc").value=S.cur.dc;renderLines();renderParts();updR();
try{localStorage.setItem(KEY,JSON.stringify(S));sv("💾 Änderungen werden in diesem Browser gespeichert","")}catch(e){sv("⚠️ Speichern in diesem Browser nicht möglich (privater Modus?)","err")}
})();
</script></body></html>
